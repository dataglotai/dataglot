name: Docker

# Public-repo variant: builds the container image for BOTH linux/amd64 and
# linux/arm64, each on a NATIVE runner, then merges the two digests into one
# multi-arch manifest. Never build the arm64 half under QEMU — the fat-LTO
# release build OOM-kills emulated runners (observed repeatedly in the private
# repo before its arm64 image job was removed). ubuntu-24.04-arm runners are
# free for public repositories, so native is also the cheap path.
#
# `latest` follows the default branch as well as semver tags: in this snapshot
# repo main only moves at releases, so main HEAD and the newest release tag are
# the same tree — and it lets a workflow-only change refresh the multi-arch
# `latest` manifest without cutting a new version.

on:
  # Nightly build at 2 AM UTC — keeps base-image (distroless/Debian) security
  # patches flowing into the image without a manual bump.
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ── Build each platform natively, push by digest ──────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      # One arch failing must not cancel the other — partial results still
      # tell us which side broke.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-platform cache scope so the two builds don't evict each other.
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pair }}
          # Push the platform image by digest only; the merge job below
          # assembles the digests into the tagged multi-arch manifest.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge the per-platform digests into one tagged manifest ───────────────
  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # ── Security scan on the merged manifest ──────────────────────────────────
  scan:
    name: Security scan
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write  # upload-sarif to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        # SHA-pinned (v0.36.0): third-party action running with registry
        # credentials in scope — a moving `master` ref would be a
        # supply-chain hole in the public repo.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload SARIF as workflow artifact
        # Always downloadable from the run page — the canonical place to grab
        # findings regardless of the Security-tab upload below.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 30

      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@v4.37.7
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Print Trivy summary to job log
        # SHA-pinned (v0.36.0): third-party action running with registry
        # credentials in scope — a moving `master` ref would be a
        # supply-chain hole in the public repo.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        if: always()
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
