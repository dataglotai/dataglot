host = "0.0.0.0"
port = 5432
batch_size = 8192
partitions = 4
default_catalog = "pg"
default_schema = "public"

[catalogs.pg]
kind = "postgres"
dsn_env = "DEMO_PG_DSN"

[catalogs.pg_orders]
kind = "postgres"
dsn_env = "DEMO_ORDERS_DSN"

[catalogs.mysql_demo]
kind = "mysql"
dsn_env = "DEMO_MYSQL_DSN"

[[masks]]
table = "users"
column = "email"
mask_literal = "***@example.com"

[[row_filters]]
table = "users"
predicate = { kind = "eq_string", column = "email", value = "bob@example.com" }

[[governance_publishers]]
kind = "datahub"
gms_endpoint = "http://wiremock:8080"
